services:

  database:

    image: postgres:16

    container_name: ulpf-postgres

    restart: unless-stopped

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: ulpf_database

    ports:

      - "5433:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  redpanda:

    image: redpandadata/redpanda:v24.3.6

    container_name: ulpf-redpanda

    restart: unless-stopped

    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092

    ports:
      - "9092:9092"

    volumes:
      - redpanda_data:/var/lib/redpanda/data

    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -e"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  backend:

    build:

      context: ./backend

    container_name: ulpf-backend

    restart: unless-stopped

    ports:

      - "8000:8000"

    environment:

      QUEUE_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_INGESTED_TOPIC: raw-logs-ingested
      KAFKA_DLQ_TOPIC: raw-logs-dlq
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@database:5432/ulpf_database

    volumes:

      - ./backend:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    depends_on:

      database:
        condition: service_started
      redpanda:
        condition: service_healthy


  frontend:

    build:

      context: ./frontend

    container_name: ulpf-frontend

    restart: unless-stopped

    ports:

      - "5173:5173"

    volumes:

      - ./frontend:/app

      - /app/node_modules

    depends_on:

      - backend


volumes:

  redpanda_data:

  postgres_data: