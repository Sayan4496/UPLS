services:

  minio:

    image: alpine/minio:RELEASE.2025-10-15T17-29-55Z

    container_name: ulpf-minio

    restart: unless-stopped

    user: "0:0"

    command: server /data --console-address ":9001"

    environment:

      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}

    ports:

      - "9000:9000"
      - "9001:9001"

    volumes:

      - minio_data:/data

    healthcheck:

      test: ["CMD-SHELL", "wget --spider --quiet http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  database:

    image: postgres:16

    container_name: ulpf-postgres

    restart: unless-stopped

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: ulpf_database

    ports:

      - "5433:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:

      test: ["CMD-SHELL", "pg_isready -U postgres -d ulpf_database"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  redpanda:

    image: redpandadata/redpanda:v24.3.6

    container_name: ulpf-redpanda

    restart: unless-stopped

    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp
      - "1"
      - --memory
      - 1G
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --check=false
      - --kafka-addr
      - internal://0.0.0.0:9092
      - --advertise-kafka-addr
      - internal://redpanda:9092

    ports:
      - "9092:9092"

    volumes:
      - redpanda_data:/var/lib/redpanda/data

    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -e"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  backend:

    build:

      context: ./backend

    container_name: ulpf-backend

    restart: unless-stopped

    ports:

      - "8000:8000"

    environment:

      QUEUE_ENABLED: "false"
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_INGESTED_TOPIC: raw-logs-ingested
      KAFKA_DLQ_TOPIC: raw-logs-dlq
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@database:5432/ulpf_database
      DATA_LAKE_ENABLED: ${DATA_LAKE_ENABLED:-false}
      DATA_LAKE_EXPORT_INTERVAL_SECONDS: ${DATA_LAKE_EXPORT_INTERVAL_SECONDS:-300}
      DATA_LAKE_BATCH_SIZE: ${DATA_LAKE_BATCH_SIZE:-1000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-ulpf-datalake}

    volumes:

      - ./backend:/app

    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

    depends_on:

      database:
        condition: service_started
      redpanda:
        condition: service_healthy

  ulpf-datalake-exporter:

    build:

      context: ./backend

    container_name: ulpf-datalake-exporter

    restart: unless-stopped

    environment:

      DATABASE_URL: postgresql+psycopg2://postgres:postgres@database:5432/ulpf_database
      DATA_LAKE_ENABLED: ${DATA_LAKE_ENABLED:-false}
      DATA_LAKE_EXPORT_INTERVAL_SECONDS: ${DATA_LAKE_EXPORT_INTERVAL_SECONDS:-300}
      DATA_LAKE_BATCH_SIZE: ${DATA_LAKE_BATCH_SIZE:-1000}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-ulpf-datalake}
      PYTHONUNBUFFERED: "1"

    volumes:

      - ./backend:/app

    command: python datalake_exporter.py

    depends_on:

      minio:
        condition: service_healthy
      database:
        condition: service_healthy


  frontend:

    build:

      context: ./frontend

    container_name: ulpf-frontend

    restart: unless-stopped

    ports:

      - "5173:5173"

    volumes:

      - ./frontend:/app

      - /app/node_modules

    depends_on:

      - backend


volumes:

  postgres_data:

  minio_data:
  redpanda_data:

  postgres_data:
