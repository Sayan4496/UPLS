services:

  database:

    image: postgres:16

    container_name: ulpf-postgres

    restart: unless-stopped

    environment:

      POSTGRES_USER: postgres

      POSTGRES_PASSWORD: postgres

      POSTGRES_DB: ulpf_database

    ports:

      - "5433:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro


  backend:

    build:

      context: ./backend

    container_name: ulpf-backend

    restart: unless-stopped

    ports:

      - "8000:8000"

    environment:

      DATABASE_URL: postgresql+psycopg2://postgres:postgres@database:5432/ulpf_database

    depends_on:

      - database


  frontend:

    build:

      context: ./frontend

    container_name: ulpf-frontend

    restart: unless-stopped

    ports:

      - "5173:5173"

    depends_on:

      - backend


volumes:

  postgres_data: